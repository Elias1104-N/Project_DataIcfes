# ==============================================================================
# config.yml — Parámetros del pipeline de integración ICFES (Saber 11 / Saber Pro)
#
# Este archivo es el ÚNICO lugar donde deben cambiarse años, rutas o umbrales.
# Cuando el ICFES publique Saber Pro 2026 (o Saber 11 2026-1), basta con:
#   1. Copiar el/los .txt nuevo(s) a data/raw/SaberPro (o Saber11)
#   2. Actualizar periodos.saber11_hasta / periodos.saberpro_hasta abajo
#   3. Volver a ejecutar run_all.R
# No se debe tocar ningún script en R/ para regenerar la base con el año nuevo.
# ==============================================================================

default:
  ventana_saber11:
    periodo_desde: 20141
    periodo_hasta: 20252
  ventana_saberpro:
    anio_desde: 2014
    anio_hasta: 2025
  escala_saberpro:
    periodo_cambio: 20162
  ventana_cruce_saber11:
    periodo_desde: 20141
    periodo_hasta: 20252
  ventana_cruce_saberpro:
     periodo_desde: 20141
     periodo_hasta:  20252
  validacion_rangos:
    saber11_punt_global: [0, 500]
    saberpro_punt_global: [0, 300]
  llave_cruce_oficial:
    consecutivo_saber11: "estu_consecutivo"
    consecutivo_saberpro: "estu_consecutivo"
    archivo_cruce: "data/raw/Saber11_SaberPro/cruce_saber11_saberpro.txt"    
    columna_cruce_saber11: "estu_consecutivo_sb11"
    columna_cruce_saberpro: "estu_consecutivo_sbpro"
    columna_periodo_cruce_saber11: "periodo_sb11"
    columna_periodo_cruce_saberpro: "periodo_sbpro"
  paths:
    raw_saber11:         "data/raw/Saber11"
    raw_saberpro:         "data/raw/SaberPro"
    metadata_saber11:      "data/metadata/diccionario_saber11.xlsx"
    metadata_saberpro:     "data/metadata/diccionario_saberpro.xlsx"
    metadata_dane:         "data/metadata/divipola.xlsx"
    log_file:              "logs/ejecucion.log"